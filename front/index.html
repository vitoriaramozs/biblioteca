<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca (PHP)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="div1">
            <h1> Cadastre um autor</h1>
        </div>
    </div>
    <div class="container2">
        <div class="container_formulario">
            <form action="http://localhost/biblioteca/back/index.php" method="post">
                <input type="text" name="autorLivro" placeholder="Digite o autor:">
                <br>
                <input type="text" name="descricaoLivro" placeholder="Descrição do livro">
                <br>
                <input type="text" name="ano_publicacao" placeholder="Ano de publicação">
                <br>
                <input type="submit" value="Enviar" id="botao">
            </form>
        </div>
    </div>
</body>
</html>
